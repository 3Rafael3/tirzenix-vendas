<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./logo.svg" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" href="./logo.svg" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, maximum-scale=5"
    />
    <meta name="theme-color" content="#070708" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Tirzenix" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta
      name="description"
      content="Sistema profissional de controle de vendas, reservas, clientes e estoque"
    />
    <title>Tirzenix · Controle de Vendas</title>
  </head>
  <body class="antialiased">
    <div id="root"></div>
    <!-- SPA redirect handler para GitHub Pages -->
    <script>
      (function () {
        var s = window.location.search;
        if (s && s.indexOf("?p=") === 0) {
          var redirect = decodeURIComponent(s.slice(3));
          window.history.replaceState(null, "", redirect || "/");
        }
      })();
    </script>
    <!-- Registrar service worker (PWA / offline) com auto-update agressivo -->
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", function () {
          var swUrl = new URL("sw.js", document.baseURI).toString();
          navigator.serviceWorker
            .register(swUrl)
            .then(function (reg) {
              // Confere por updates a cada visita
              if (reg.update) reg.update();
              // Quando um novo SW for ativado, recarrega para pegar assets novos
              if (reg.waiting) reg.waiting.postMessage({ type: "SKIP_WAITING" });
              navigator.serviceWorker.addEventListener("controllerchange", function () {
                // Evita loop infinito
                if (window.__tirzenixReloaded) return;
                window.__tirzenixReloaded = true;
                window.location.reload();
              });
            })
            .catch(function () {});
        });
      }
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
